name: Coverage (main)

# Main owns both persistent coverage outputs: the ratchet baseline and the
# CodeScene upload. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene, and
# the CV-005 contract tests under tests/ hold that shape.
#
# The CodeScene call is what moves here, not the artefact: the shared uploader
# pins the cs-coverage archive by digest, but the tool talks to CodeScene's API
# and refuses to run when that answer changes shape. Keeping the call on the
# trunk keeps such a change off every pull request's critical path.

on:
  push:
    branches: [main]
  # A dispatch measures on demand: merges made with the automerge workflow's
  # GITHUB_TOKEN fire no push event. It is a partial stand-in for the missing
  # push: a dispatch on main uploads a fresh report, but the shared action
  # writes a new baseline only on a push to refs/heads/main, so the ratchet
  # catches up at the next push. The upload step below checks the ref, so a
  # dispatch aimed at a branch neither moves the baseline nor publishes that
  # branch's coverage as the trunk's.
  workflow_dispatch:

# Never cancelled. A cancelled run abandons both its upload and its baseline
# write; with cancellation off, a newer push waits for the running one and
# replaces any run still pending, so the newest baseline wins. The group is
# keyed on the ref and the event because a newer run replaces a pending one
# whatever cancel-in-progress says: a branch dispatch, which neither uploads
# nor writes a baseline, or a dispatch on main, which uploads but writes no
# baseline, must not displace main's pending push.
concurrency:
  group: coverage-main-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        # Nothing after checkout needs Git credentials, and the coverage run
        # executes repository and dependency code.
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The selection is the baseline every pull request's ratchet is measured
      # against, so ci.yml's must match it field for field.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: docx_comment_extractor
          baseline-python-file: .coverage-baseline.python
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        # The token check lets a fork run this workflow without the secret. The
        # ref check is what stops a dispatch from a branch uploading that
        # branch's coverage as the trunk's.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
