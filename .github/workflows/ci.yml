name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install CLI tools
        run: |
          for tool in mbake ty; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Check spelling
        run: make spelling

      - name: Run typechecker
        run: make typecheck

      # Pull requests measure coverage for their own ratchet and nothing else:
      # no report is published and CodeScene is never contacted from here.
      # A push to main measures in coverage-main.yml instead, which owns the
      # baseline this ratchet compares against, so the selection below must
      # match that workflow's field for field.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@2a910bfcfd1ea4216419f9290331785f05b33320
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: docx_comment_extractor
          baseline-python-file: .coverage-baseline.python
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'
