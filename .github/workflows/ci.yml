name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install CLI tools
        run: |
          for tool in mbake ty; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Check spelling
        run: make spelling

      - name: Run typechecker
        run: make typecheck

      # Pull requests measure coverage for their own ratchet and nothing else:
      # no report is published and CodeScene is never contacted from here.
      # A push to main measures in coverage-main.yml instead, which owns the
      # baseline this ratchet compares against, so the selection below must
      # match that workflow's field for field.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: docx_comment_extractor
          baseline-python-file: .coverage-baseline.python
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'
